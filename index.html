<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MATHFORCES</title>
    <!-- KaTeX for LaTeX Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div id = "webtitle"><h1>&delta; MATHFORCES</h1></div><br>
    <div id="login-page">
        <h1>LOG IN</h1><br>
        Mail:<input id = "login-mail"></input><br>
        Password:<input id = "login-password"></input><br>
        <button id = "login-confirm">log in</button><br>
        <button id = "signup-transition">or sign in</button>
    </div>

    <div id="signup-page">
        <h1>SIGN UP</h1><br>
        Mail:<input id = "signup-mail"></input><br>
        Password:<input id = "signup-password"></input><br>
        <button id = "signup-confirm">sign up</button><br>
        <button id = "login-transition">or log in</button>
    </div>

    <div id="main-page">
        <button id = "logout-confirm">log out</button><br>
        <button id = "viewprofile-btn">view profile</button><br>
        <button id = "ranking-btn">ranking</button><br><br><br>
        <div id = "level-tab">
            <button id = "div4-btn">Division 4</button>
            <button id = "div3-btn">Division 3</button>
            <button id = "div2-btn">Division 2</button>
            <button id = "div1-btn">Division 1</button>
            <button id = "div0-btn">Division 0</button>
            <button id = "special-btn">Special</button>
        </div>
        <div id = "problems-box">
            
        </div>
        <div id="description-tab">
            <input id = "problem-title" value = "The Next Oiler" disabled placeholder="Locked"></input>
            <br>
            <div id = "description-box">We are the oilers</div>
            <br>
            <input id = "answer-field"></input>
            <button id = "submit-btn">submit</button>
        </div>
    </div>

    <div id="profile-page">
        <button id = "back-btn">go back</button><br>
        USERNAME:
        <input id = "username-field" disabled placeholder="Locked" value=""></input>
        <br>
        RATING:
        <input id = "rating-field" disabled placeholder="Locked" value=""></input>
        <br>
        SOLVED PROBLEMS:
        <div id = "solved-problems-box">
            
        </div>
    </div>


    <footer>
        <div id="credit">
            <h6>Brought to you by Firlance.</h6>
        </div>
    </footer>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api.js"></script>
    <script src="main.js"></script>
</body>
</html>
